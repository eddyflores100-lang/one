name = "one-mcp"
main = "worker.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]

# Ruta pública final: mcp.alicelabs.space (zona ya en Cloudflare del fundador).
workers_dev = true

routes = [
  { pattern = "mcp.alicelabs.space", custom_domain = true }
]

# Libro duradero de pagos/trueque (namespace one-libro, creado 9-nov-2026).
[[kv_namespaces]]
binding = "ONE_KV"
id = "91b6283c369e4fb1927c7efad2c42bda"
